name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: |
          mvn -B -DskipTests clean package

      - name: Check jar exists before upload
        run: |
          ls -l target/zongshe-0.0.1-SNAPSHOT.jar

      - name: Pause webserver.service (stop)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_SUDO }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            sudo systemctl stop webserver.service || true

      - name: Upload backend jar to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_SUDO }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "target/zongshe-0.0.1-SNAPSHOT.jar"
          target: "/tmp/"
          strip_components: 1

      - name: Move jar and set permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_SUDO }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            ls -l /tmp/zongshe-0.0.1-SNAPSHOT.jar || (echo "jar not found in /tmp" && exit 1)
            sudo mkdir -p /opt/webserver
            sudo mv /tmp/zongshe-0.0.1-SNAPSHOT.jar /opt/webserver/zongshe-0.0.1-SNAPSHOT.jar
            sudo chown webserver:webserver /opt/webserver/zongshe-0.0.1-SNAPSHOT.jar
            sudo chmod 750 /opt/webserver/zongshe-0.0.1-SNAPSHOT.jar

      - name: Upload nginx config and reload nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_SUDO }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          scp: true
          local: 'script/zongshe_nginx.conf'
          remote: '/tmp/'
          script: |
            set -e
            sudo mkdir -p /etc/nginx/sites-available/zongshe
            sudo mv /tmp/zongshe_nginx.conf /etc/nginx/sites-available/zongshe/zongshe_nginx.conf
            sudo chown root:root /etc/nginx/sites-available/zongshe/zongshe_nginx.conf
            sudo chmod 644 /etc/nginx/sites-available/zongshe/zongshe_nginx.conf
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Upload systemd unit and enable service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_SUDO }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          scp: true
          local: 'script/webserver.service'
          remote: '/tmp/'
          script: |
            set -e
            sudo mv /tmp/webserver.service /etc/systemd/system/webserver.service
            sudo chown webserver:webserver /etc/systemd/system/webserver.service
            sudo chmod 644 /etc/systemd/system/webserver.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now webserver.service
